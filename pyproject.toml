[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-scholar-skills"
version = "0.2.35"
description = "Medical research, statistical review, manuscript authoring, and display QC capability package for OPL."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
  { name = "Gao Feng" },
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
render = [
  "matplotlib>=3.9,<4",
  "pillow>=10.0,<14",
  "pymupdf>=1.25,<2",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["runtime/kernel_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
